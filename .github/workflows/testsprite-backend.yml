# The 28 TestSprite backend tests (project "Ninety API") as a required check.
#
#   - pull_request: waits for Vercel's commit status on the PR head to say the preview is ready,
#     then tests that preview (the branch URL ninety-git-<branch>-mohamedwael201193s-projects.vercel.app);
#   - push to main: waits for the production deployment of that commit, then tests
#     https://ninety-coral.vercel.app.
# This Vercel project posts commit statuses, not GitHub deployments, so `deployment_status` never
# fires (the first version of this workflow, in #61, waited on it and never ran).
# scripts/ci/backend-run.mjs points each test's BASE_URL at the target (TestSprite gives backend
# tests no environment URL) and fails the job if any test does not pass.
# Cost: 28 × 0.2 = 5.6 credits per run. Needs the repository secret TESTSPRITE_API_KEY.
name: TestSprite backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Base URL to test"
        default: "https://ninety-coral.vercel.app"
        required: true

permissions:
  contents: read
  statuses: read
  pull-requests: write

concurrency:
  # The tests are shared, so only one target at a time.
  group: testsprite-backend
  cancel-in-progress: false

env:
  TESTSPRITE_CLI_VERSION: "0.15.0"

jobs:
  backend:
    name: TestSprite backend (28 API tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Docs-only change? (then no paid run)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Markdown and docs/ never reach the deployed API, so a change touching only those
          # passes this required check without spending TestSprite credits. Anything else runs.
          case "$EVENT" in
            pull_request) files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') ;;
            push) files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || echo "unknown") ;;
            *) files="manual" ;;
          esac
          code=$(printf '%s\n' "$files" | grep -Ev '(\.md$|^docs/)' | grep -c . || true)
          if [ -n "$files" ] && [ "$code" = "0" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: TestSprite backend run skipped (0 credits)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Wait for the Vercel deployment and pick the target
        id: target
        if: ${{ steps.scope.outputs.docs != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref }}
          INPUT: ${{ inputs.target }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "url=${INPUT%/}" >> "$GITHUB_OUTPUT"; exit 0; fi
          for i in $(seq 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" --jq '[.[]|select(.context=="Vercel")][0].state' 2>/dev/null || true)
            [ "$state" = "success" ] && break
            [ "$state" = "failure" ] || [ "$state" = "error" ] && { echo "::error::Vercel deployment $state"; exit 1; }
            sleep 10
          done
          [ "$state" = "success" ] || { echo "::error::Vercel deployment not ready after 15 minutes"; exit 1; }
          if [ "$EVENT" = "pull_request" ]; then
            slug=$(echo "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g')
            url="https://ninety-git-${slug}-mohamedwael201193s-projects.vercel.app"
          else
            url="https://ninety-coral.vercel.app"
            sleep 30 # the production alias moves a few seconds after the status
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/openapi.json")
          [ "$code" = "200" ] || { echo "::error::$url/api/openapi.json answered $code"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Testing $EVENT deployment of $SHA at $url"
      - name: Run the 28 backend tests
        if: ${{ steps.scope.outputs.docs != 'true' }}
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          TARGET: ${{ steps.target.outputs.url }}
        run: |
          if [ -z "$TESTSPRITE_API_KEY" ]; then
            echo "::error::Add the TESTSPRITE_API_KEY repository secret to run this workflow."
            exit 1
          fi
          npm install -g "@testsprite/testsprite-cli@${TESTSPRITE_CLI_VERSION}"
          node scripts/ci/backend-run.mjs "$TARGET"
      - name: Results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testsprite-backend-${{ github.run_id }}
          path: backend-results.json
          if-no-files-found: ignore
      - name: Triage comment on the pull request (red runs only)
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("node:fs");
            const triage = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/triage.mjs`);
            const results = fs.existsSync("backend-results.json") ? JSON.parse(fs.readFileSync("backend-results.json", "utf8")) : null;
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const body = triage.triageComment(results, {
              runUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              sha, ref: sha, workflow: "TestSprite backend", repoUrl: `${context.serverUrl}/${owner}/${repo}` });
            if (!body) return;
            await github.rest.issues.createComment({ owner, repo, issue_number: context.payload.pull_request.number, body });
