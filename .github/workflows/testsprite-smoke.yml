# Nightly TestSprite smoke on production: 4 tests, not the whole suite.
#
# The full suite (testsprite-cli.yml) bills every test in the project (54 x 0.5 = 27 credits).
# This runs three core flows against https://ninety-coral.vercel.app every night:
#   TS01 example trips   (the dashboard counts a known history)
#   TS03 add a trip      (manual entry gives exact days used and left)
#   TS07 EES gap         (the EES comparison names the gap)
#   TS62 phone days bar  (390 px: the sticky bar and its Add trip button; CLI-only project, see
#                         scripts/ci/smoke-run.mjs: the GitHub App cannot run at phone width)
# Cost: 4 x 0.5 = 2 credits a night (frontend price at the time of writing).
# scripts/ci/smoke-run.mjs runs one `testsprite test run <id> --target-url ... --wait` per test:
# CLI 0.15.0 accepts several ids in one call only with --local (one shared tunnel).
# Every finished run is recorded publicly by run-ledger.yml on the "Run log" issue, and a red
# night opens a `testsprite-red` issue with the failing tests and their TestSprite run ids.
# Set the repository variable TESTSPRITE_SMOKE to "false" to pause the nightly.
# Needs the repository secret TESTSPRITE_API_KEY. Never runs on push or pull_request.
name: TestSprite smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read
  checks: write

concurrency:
  group: testsprite-smoke
  cancel-in-progress: false

env:
  TESTSPRITE_CLI_VERSION: "0.15.0"
  TARGET_URL: https://ninety-coral.vercel.app
  SMOKE_PLANS: "TS01-example-trips TS03-add-trip TS07-ees-gap TS62-phone-days-bar"

jobs:
  smoke:
    name: TestSprite smoke on production (4 tests)
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && vars.TESTSPRITE_SMOKE != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Preflight
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          if [ -z "$TESTSPRITE_API_KEY" ]; then
            echo "::error::Add the TESTSPRITE_API_KEY repository secret to run this workflow."
            exit 1
          fi
          npm install -g "@testsprite/testsprite-cli@${TESTSPRITE_CLI_VERSION}"
          testsprite doctor
      - name: Run the smoke tests (one CLI call per test)
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          testsprite credits | tee credits-before.txt || true
          node scripts/ci/smoke-run.mjs "$TARGET_URL"
      - name: Failure bundles for every failed test
        if: ${{ failure() && hashFiles('testsprite-junit.xml') != '' }}
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          mkdir -p failure-bundles
          node scripts/ci/failed-runs.mjs testsprite-junit.xml | while read -r run; do
            testsprite test artifact get "$run" --out "failure-bundles/$run" || echo "::warning::No bundle for $run"
          done
      - name: Upload the JUnit report (read by run-ledger.yml)
        if: ${{ always() && hashFiles('testsprite-junit.xml') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testsprite-junit-${{ github.run_id }}
          path: |
            testsprite-junit.xml
            smoke-summary.json
            failure-bundles/
          if-no-files-found: ignore
      - name: Credits after
        if: ${{ always() }}
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          {
            echo "<details><summary>Credits before and after</summary>"; echo; echo '```'
            echo "before:"; cat credits-before.txt 2>/dev/null || echo "(not read)"
            echo "after:"; testsprite credits 2>/dev/null || echo "(not read)"
            echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
